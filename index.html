<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <title>Classic Luxury Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f5ef;
            color: #1e1e1e;
            font-family: 'Inter', sans-serif;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background:
                linear-gradient(rgba(0, 0, 0, 0.45),
                        rgba(0, 0, 0, 0.45)),
                url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem;
            color: #fff;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #f1f1f1;
            font-size: 1.1rem;
            max-width: 650px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .btn {
            padding: 14px 38px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: white;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }

            .navbar {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">LUXORA</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Collections</a>
            <a href="#">Shop</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Timeless Elegance</h1>

        <p>
            Discover premium fashion crafted with elegance,
            simplicity, and modern luxury. A classic shopping
            experience designed for refined taste.
        </p>

        <button class="btn">SHOP NOW</button>
    </section>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

</body>

</html>
